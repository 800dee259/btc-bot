name: Kalshi Bot

on:
  workflow_dispatch:   # enables the manual "Run workflow" button
    inputs:            # optional
      dry_run:
        description: "Run without placing trades"
        type: boolean
        default: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python bot.py
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
